# =====================================================================
# /opt/heimdall/safety.yaml
# Owner: root:root   Mode: 0600
# Validated against heimdald.py v2.0.0-m1
# =====================================================================
version: 2
policy_id: "watchtower-v2"
last_modified: "2025-01-01T00:00:00Z"
owner_uid_required: 0
mode_required: "0600"

# ---------------------------------------------------------------------
# RUNTIME MODE
# ---------------------------------------------------------------------
runtime_mode:
  default: hybrid

  domain_enforce:
    destructive_study: sandbox
    code_generation: hybrid
    red_teaming: direct
    forensics: direct
    linux_administration: direct

  flag_enforce:
    "code_generation.python.execute": sandbox
    "code_generation.rust.cargo_run": sandbox
    "red_teaming.exploitation.metasploit_exploit": sandbox
    "red_teaming.c2.sliver": sandbox
    "red_teaming.c2.mythic": sandbox

  direct:
    write_ahead_log: true
    require_confirmation_for_allow: false
    require_confirmation_for_warn: true
    require_typed_phrase_for_warn: true
    rate_limit_per_minute: 30
    panic_hotkey: "Ctrl-]"
    abort_if_daemon_unreachable: true
    auto_approve_logs_extra: true
    cgroup_limits:
      memory_max: "4G"
      cpu_quota: "200%"
      pids_max: 512

  sandbox:
    impl: bwrap
    net: none
    ro_root: true
    rw_paths:
      - "$HOME/projects"
      - "$HOME/.cache/heimdall"
    unshare: [pid, uts, ipc, cgroup]
    seccomp_profile: default
    cap_drop: [ALL]

  hybrid:
    default: direct
    auto_sandbox_when:
      - flag_suffix_in: [".execute", ".run", ".detonate", ".install", ".publish"]
      - flag_prefix_in: ["destructive_study."]
      - contains_unsafe_code: true
      - safety_label: deny
      - command_reads_from_stdin_pipe: true

# ---------------------------------------------------------------------
# DEFAULTS
# ---------------------------------------------------------------------
defaults:
  unknown_flag: false
  unknown_command: false
  warn_requires_confirmation: true
  confirmation_timeout_sec: 45
  destructive_confirmation_phrase: "I HAVE WRITTEN AUTHORIZATION"
  mode_switch_confirmation_phrase: "I UNDERSTAND THE RISK"
  log_all_decisions: true
  max_agent_iterations: 10
  no_progress_repeat_limit: 2
  allow_auto_approve: false
  auto_approve_requires_phrase: true
  auto_approve_phrase: "I ACCEPT AUTO-APPROVE FOR THIS SESSION"
  allow_update_check: true
  history_rag_max_sessions: 500
  history_rag_max_days: 30
  history_rag_top_k: 3
  history_rag_min_score: 0.15

# ---------------------------------------------------------------------
# LAB MODE — gate for destructive_study.*
# ---------------------------------------------------------------------
lab_mode:
  enabled: false
  require_offline: true
  require_isolated_netns: true
  forbid_host_mounts: true
  require_sample_hash_log: true
  evidence_dir: /var/lib/heimdall/evidence
  auto_flip_off_after_minutes: 120

# ---------------------------------------------------------------------
# ABSOLUTE DENIALS — cannot be overridden by any flag
# ---------------------------------------------------------------------
global_deny:
  - match: '^rm\s+-rf\s+/(\s|$)'
    reason: "Root filesystem deletion"
  - match: ':\(\)\s*\{.*\};\s*:'
    reason: "Fork bomb"
  - match: '^mkfs\.'
    reason: "Filesystem format"
  - match: '^dd\s+.*of=/dev/(sd|nvme|hd|vd)'
    reason: "Raw disk write"
  - match: '(curl|wget)\s+[^|]*\|\s*(ba|z|k)?sh'
    reason: "Pipe-to-shell"
  - match: 'chmod\s+.*777\s+/\s*$'
    reason: "World-writable root"
  - match: '^\s*>\s*/dev/(sd|nvme|hd|vd)'
    reason: "Raw disk overwrite"
  - match: 'iptables\s+-F\s*$'
    reason: "Firewall flush"
  - match: 'shred\s+-[a-z]*z?\s+/dev/(sd|nvme)'
    reason: "Disk shred"
  - match: 'sysctl\s+-w\s+kernel\.(panic|sysrq)'
    reason: "Kernel behavior override"
  - match: '^\s*(sudo\s+)?(rm|shred|wipe)\s+.*(~|/home/[^/]+)/(\.ssh|\.gnupg|\.aws|\.config/gh|\.docker)'
    reason: "Deletion of credential directories"
  - match: 'curl\s+.*\.(onion|i2p)'
    reason: "Tor/I2P egress"
  - match: 'history\s+-c\s*$'
    reason: "Shell history wipe (anti-forensics)"

# ---------------------------------------------------------------------
# REUSABLE MESSAGES
# ---------------------------------------------------------------------
messages:
  destructive: >-
    This action is destructive and may cause data loss or system damage.
    Proceed at your own responsibility?
  privileged: >-
    This requires elevated privileges and can affect system stability or
    security. Proceed at your own responsibility?
  exfiltration: >-
    This may send data to a remote host and leak sensitive information.
    Proceed at your own responsibility?
  offensive_passive: >-
    Passive reconnaissance touches public data only. Confirm you have a
    legitimate reason; even passive recon on non-consenting parties can
    violate privacy law in some jurisdictions.
  offensive_active: >-
    Active reconnaissance sends traffic to the target. Using it against
    systems you do not own or have written authorization to test is
    illegal in most jurisdictions (CMA, CFAA, or local equivalent).
    Proceed at your own responsibility?
  offensive_exploit: >-
    This attempts to exploit a vulnerability. Verify the target is inside
    your authorized testing boundary. Proceed at your own responsibility?
  offensive_post: >-
    Post-exploitation actions leave traces and may violate scope even in
    authorized tests. Proceed?
  offensive_c2: >-
    This starts or connects to a C2 framework. C2 traffic can be flagged
    by defenders and may breach scope. Proceed?
  offensive_ad: >-
    This performs Active Directory attack steps. Requires explicit written
    authorization from the AD owner.
  offensive_wireless: >-
    Wireless attacks affect shared RF spectrum and can impact non-target
    networks. Only perform on networks you own or are authorized to test.
  code_write: >-
    About to write code to disk. Review path and contents; an overwrite
    may destroy an existing file.
  code_execute: >-
    About to execute generated code that has not been human-reviewed.
    Proceed at your own responsibility?
  unsafe_code: >-
    Generated code uses constructs that bypass memory or type safety
    (Rust `unsafe`, Python `ctypes`/`exec`/`eval`). Review carefully.
  external_dependency: >-
    This pulls third-party code from a public registry. The dependency
    chain is not audited. Proceed at your own responsibility?
  malware_analysis: >-
    Malware analysis carries infection risk. Confirm sandboxed,
    network-isolated environment before proceeding.
  anti_forensics: >-
    Log tampering, timestomping, or track-covering can constitute
    obstruction of justice even during authorized tests. Proceed?
  ai_abuse: >-
    Deepfakes, voice cloning, disinformation, and automated social
    engineering are illegal in many jurisdictions. Proceed at your own
    responsibility?
  supply_chain: >-
    Supply-chain attack tooling targets third parties and is treated as
    computer fraud and sabotage in many places. Proceed only within an
    authorized red-team simulation scope.
  botnet_ddos: >-
    DDoS / botnet activity is illegal regardless of authorization. Only
    permitted for traffic-generation research on infrastructure you own,
    with coordination.
  cryptojacking: >-
    Unauthorized cryptomining steals compute and is treated as fraud/theft.
    Only permitted on systems you own.
  lab_required: >-
    This action is only permitted while lab_mode is enabled and the
    environment passes isolation checks.
  sandbox_disabled: >-
    Sandboxed execution has been disabled by policy for this command.
  direct_mode_warning: >-
    DIRECT MODE: this command will run on your real system with your
    privileges. A mistake or a prompt-injection could read, modify, or
    exfiltrate any file you can access. Confirm you understand this.

